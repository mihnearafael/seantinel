{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow border-0">
            <div class="card-header bg-info text-dark text-center py-3">
                <h4 class="mb-0"><i class="bi bi-shield-check"></i> Authorized Personnel Login</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button class="btn btn-dark w-100 mt-3" type="submit">Secure Login</button>
                </form>
                <div class="text-center mt-3">
                    <p class="text-muted">Don't have an institution account? <a href="{% url 'users:register' %}">Register here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
